name: Deploy CDK stack

on:
  push:
    branches: [main]      # deploy on every push to main
  workflow_dispatch:      # also adds a "Run workflow" button in the Actions tab

concurrency:
  group: cdk-deploy       # never run two deploys at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js         # runs CDK
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python          # pip builds the layer
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CDK dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy
        run: npx cdk deploy --require-approval never